<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cupons do sorteio para imprimir · AxiFit</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;color:#14171C;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.folha{width:210mm;height:297mm;padding:8.5mm 10mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);position:relative}
.c{border:0.3mm dashed #9AA0A8;padding:3.2mm 3.6mm 2.6mm;display:flex;flex-direction:column;position:relative;overflow:hidden}
.c:nth-child(odd){border-right:none}.c:nth-child(n+3){border-top:none}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.2mm;background:#E10600}
.top{display:flex;align-items:center;gap:3mm;padding-left:1.6mm}
.top img{height:9mm;width:auto}
.tit{flex:1;line-height:1.15}
.tit b{display:block;font-size:9.4pt;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.tit span{display:block;font-size:7pt;color:#5B616B}
.num{border:0.45mm solid #E10600;border-radius:1.6mm;padding:1mm 2mm 1.2mm;min-width:23mm;text-align:left}
.num small{display:block;font-size:5.6pt;font-weight:700;color:#E10600;text-transform:uppercase;letter-spacing:.06em}
.num i{display:block;height:5.2mm;font-style:normal;font-size:12pt;font-weight:800}
.campos{flex:1;display:grid;grid-template-columns:1.25fr 1fr;column-gap:3mm;row-gap:0;margin-top:1.4mm;padding-left:1.6mm}
.f{display:flex;flex-direction:column;justify-content:flex-end;border-bottom:0.25mm solid #14171C;padding-bottom:.4mm;min-height:7.6mm}
.f label{font-size:5.8pt;font-weight:700;color:#5B616B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:auto;padding-top:.8mm}
.f.l{grid-column:1/3}
.f.tp{border-bottom:none}.tp span{font-size:6.6pt;display:flex;align-items:center;gap:1.1mm;white-space:nowrap}.tp span i{display:inline-block;width:2.6mm;height:2.6mm;border:0.25mm solid #14171C;border-radius:.4mm;margin-left:.8mm}.tp span i:first-child{margin-left:0}
.rod{font-size:5.6pt;color:#5B616B;margin-top:1.3mm;padding-left:1.6mm;line-height:1.25}
.rod b{color:#14171C}
.tesoura{position:absolute;font-size:8pt;color:#9AA0A8}
</style>
</head>
<body>
<div class="folha" id="folha"></div>
<script>
const um=`<div class="c">
  <div class="top"><img src="axifit-logo-vermelho.png" alt="AxiFit"><div class="tit"><b>Sorteio da Scooter Elétrica</b><span>Lançamento da nova AxiFit · cupom do plano anual</span></div>
  <div class="num"><small>Cupom Nº</small><i></i></div></div>
  <div class="campos">
    <div class="f"><label>Código do aluno</label></div><div class="f"><label>Data</label></div>
    <div class="f l"><label>Nome do aluno</label></div>
    <div class="f"><label>WhatsApp</label></div><div class="f tp"><label>Tipo do cupom</label><span><i></i>Anual novo <i></i>Renovação <i></i>Indicação</span></div>
    <div class="f"><label>Consultor</label></div><div class="f"><label>Assinatura do consultor</label></div>
  </div>
  <p class="rod">Válido somente com o <b>mesmo número do cupom gerado no Hub</b> e a assinatura do consultor. Após preencher, deposite na urna da recepção.</p>
</div>`;
document.getElementById('folha').innerHTML=um.repeat(10);
</script>
</body>
</html>
